name: im
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  path_drawing: ^1.0.1
  lottie: ^3.1.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  shared_preferences: ^2.5.3
  handy_tdlib: ^2.3.10
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/portraits/
    - assets/icons/
    - assets/images/
    - assets/stickers/

  fonts:
    - family: OptimaNova
      fonts:
        - asset: assets/fonts/optima_nova_black.ttf
          weight: 900
    - family: Fruktur
      fonts:
        - asset: fonts/Fruktur/Fruktur-Regular.ttf
        - asset: fonts/Fruktur/Fruktur-Italic.ttf
          style: italic
